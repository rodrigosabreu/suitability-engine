spring:
  application:
    name: suitability-engine
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/suitability}
    username: ${DATABASE_USER:suitability}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: true
    consumer:
      group-id: suitability-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "br.com.itau.investments.suitability.domain.model.events"
    listener:
      ack-mode: manual_immediate
  
  vault:
    uri: ${VAULT_URI:https://vault.itau.com.br}
    namespace: banking
    authentication: KUBERNETES
    kubernetes:
      role: suitability-engine
    kv:
      enabled: true
      backend: secret
      default-context: suitability-engine
  
  opa:
    url: ${OPA_URL:http://localhost:8181}
    policy-path: /v1/data/cvm558/suitability/deny
  
  otel:
    exporter:
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
        protocol: grpc
    resource:
      attributes:
        service.name: suitability-engine
        service.version: ${app.version:1.0.0}
        deployment.environment: ${ENVIRONMENT:development}
    traces:
      sampler: parentbased_traceidratio
      sampler.arg: 0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,500ms,1s,5s

app:
  version: ${APP_VERSION:1.0.0}
  environment: ${ENVIRONMENT:development}

kafka:
  topic:
    suitability:
      assessed: itau.investments.suitability.assessed
      document_signed: itau.investments.suitability.document_signed
      approved: itau.investments.suitability.approved
      rejected: itau.investments.suitability.rejected
      expired: itau.investments.suitability.expired
      cancelled: itau.investments.suitability.cancelled

opa:
  policies-path: policies/cvm558

logging:
  level:
    br.com.itau.investments.suitability: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  structured:
    format: json
    fields:
      timestamp: true
      level: true
      logger: true
      thread: true
      mdc: true